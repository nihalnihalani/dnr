name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  pack-install:
    name: npm pack + install, installed dnr (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack, npm i -g into a fresh prefix, and test the installed dnr
        run: pnpm test:pack

  properties-nightly:
    name: property tests at 2,000 runs (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DNR_FC_RUNS: '2000'

  kiro-artifacts:
    name: Kiro artifacts and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: .kiro is tracked and not gitignored
        run: |
          test -n "$(git ls-files .kiro)" || { echo "::error::git ls-files .kiro is empty"; exit 1; }
          if git check-ignore -q .kiro; then echo "::error::.kiro is gitignored"; exit 1; fi
      - name: Every JSON artifact parses
        run: |
          status=0
          while IFS= read -r f; do
            jq -e . "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(git ls-files '.kiro/*.json' 'powers/*.json' 'trial/agents/*.json' '.devcontainer/*.json')
          exit $status
      - name: No template placeholders in files Kiro reads as-is
        run: |
          if git ls-files -z '.kiro/*.json' 'trial/agents/*.json' 'powers/*.json' | xargs -0 grep -n '{{'; then
            echo "::error::'{{' placeholder found in a Kiro-read JSON file"; exit 1
          fi
      - name: Hook files have the v1 shape
        run: |
          for f in .kiro/hooks/*.json; do
            jq -e '.version == "v1" and (.hooks | type == "array" and length > 0)
              and all(.hooks[]; (.name | type == "string") and (.trigger | type == "string")
                and .action.type == "command" and (.action.command | type == "string"))' "$f" > /dev/null \
              || { echo "::error file=$f::not a v1 hook file"; exit 1; }
          done
      - name: Shell scripts parse
        run: |
          while IFS= read -r f; do bash -n "$f"; done < <(git ls-files 'scripts/*.sh')

  playground-e2e:
    name: Playground e2e (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - id: present
        name: Playground e2e suite present?
        run: |
          if [ -f apps/playground/playwright.config.ts ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.present.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.present.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.present.outputs.run == 'true'
        run: pnpm build
      - if: steps.present.outputs.run == 'true'
        run: pnpm -F @dnr/playground exec playwright install --with-deps chromium firefox webkit
      - if: steps.present.outputs.run == 'true'
        run: pnpm -F @dnr/playground exec playwright test
      - if: always() && steps.present.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/playground/playwright-report
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI (mobile; performance >= 90, accessibility = 100)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @dnr/playground build
      # /, /play/43933a1dca, /graveyard and /trial; gates in apps/playground/lighthouserc.cjs.
      - name: lhci autorun
        working-directory: apps/playground
        run: pnpm exec lhci autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/playground/lhci-report
          if-no-files-found: ignore

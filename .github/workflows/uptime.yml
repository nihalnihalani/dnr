name: uptime

# Daily Playwright smoke test of the hosted Playground (GitHub Pages), through the end
# of judging (2027-02-05). keepalive.yml stops GitHub from disabling this schedule.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: github-pages
            url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - id: window
        name: Inside the judging window?
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20270205 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Past 2027-02-05; scheduled smoke tests are off."
          fi
      - if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v5
      - if: steps.window.outputs.active == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.window.outputs.active == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.window.outputs.active == 'true'
        run: pnpm -F @dnr/playground exec playwright install --with-deps chromium
      - if: steps.window.outputs.active == 'true'
        env:
          PLAYGROUND_URL: ${{ matrix.url }}
        run: pnpm -F @dnr/playground exec playwright test --grep @smoke --project=chromium

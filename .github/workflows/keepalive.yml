name: keepalive

# GitHub disables scheduled workflows in a public repo after 60 days without activity.
# Re-enabling them through the API resets that timer, so the uptime check keeps running
# through judging (plan §10).
on:
  schedule:
    - cron: '41 7 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow enable uptime.yml
          gh workflow enable keepalive.yml

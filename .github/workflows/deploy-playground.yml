name: deploy-playground

# Production deploys come from main until submission. Phase 14: after tagging
# submission-2026, remove `main` from push.branches so the Playground deploys only from
# that tag until judging ends (plan §10, Phase 14).
on:
  push:
    branches: [main]
    tags: [submission-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-playground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Require the Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (plan Phase 0, Accounts). Add them with gh secret set."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DNR_SITE_URL: https://dnr-playground.pages.dev/
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler is a devDependency of the playground package, so the action uses it
          # instead of trying to `pnpm add` it at the workspace root.
          workingDirectory: apps/playground
          command: >-
            pages deploy dist --project-name=dnr-playground
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Smoke test the deployment
        if: hashFiles('apps/playground/playwright.config.ts') != ''
        env:
          PLAYGROUND_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          pnpm -F @dnr/playground exec playwright install --with-deps chromium
          pnpm -F @dnr/playground exec playwright test --grep @smoke --project=chromium

  # GitHub Pages: build and upload, deploy, then check the live site, as three jobs. Running
  # deploy-pages in the job that uploaded the artifact failed intermittently with "No artifacts
  # named github-pages" (actions/deploy-pages#451), four times on 2026-11-27. A separate deploy
  # job is GitHub's own pattern and avoids that race.
  github-pages-build:
    name: GitHub Pages mirror (build)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    outputs:
      entry: ${{ steps.entry.outputs.entry }}
    env:
      # Absolute URL for og:image and the canonical link (apps/playground/vite.config.ts).
      DNR_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the /kiro page lists each .kiro file's commits (build-kiro.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The mirror is served under /<repo>/ and ignores _headers (docs/architecture.md, "Hosted
      # Playground headers"; GitHub's default application/wasm type applies).
      - name: Build for the /<repo>/ base path
        run: |
          pnpm -F @dnr/playground run build --base "/${{ github.event.repository.name }}/" --outDir dist-pages
          cp apps/playground/dist-pages/index.html apps/playground/dist-pages/404.html
          # GitHub Pages has no SPA rewrites: give every known route its own index.html so
          # deep links return HTTP 200 (404.html still catches anything else).
          cd apps/playground/dist-pages
          routes="play graveyard trial replay kiro orders/view"
          for c in $(jq -r '.cases[].id' ../public/cases/index.json); do routes="$routes play/$c"; done
          for o in $(jq -r '.rows[].order.id' ../public/cases/graveyard.json); do routes="$routes orders/$o"; done
          for r in $routes; do mkdir -p "$r" && cp index.html "$r/index.html"; done
          echo "route pages: $routes"
      - id: entry
        name: Record the entry script of this build
        run: echo "entry=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' apps/playground/dist-pages/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist-pages

  github-pages:
    name: GitHub Pages mirror
    runs-on: ubuntu-latest
    needs: github-pages-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      page_url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5

  github-pages-live:
    name: GitHub Pages mirror (live checks)
    runs-on: ubuntu-latest
    needs: [github-pages-build, github-pages]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The hosted deep-link tests run a real local board from the workspace (built CLI and UI).
      - run: pnpm build
      # Pages can take a moment to serve the new build.
      - name: Wait for the new build to be served
        env:
          PAGE_URL: ${{ needs.github-pages.outputs.page_url }}
          WANT: ${{ needs.github-pages-build.outputs.entry }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$PAGE_URL" -o page.html && grep -q "$WANT" page.html; then echo "live: $WANT"; exit 0; fi
            sleep 5
          done
          echo "::error::$PAGE_URL is not serving $WANT after 5 minutes"; exit 1
      - run: pnpm -F @dnr/playground exec playwright install --with-deps chromium firefox webkit
      # The smoke test, every route's console, the 404 page, meta tags and WASM type, and the
      # hosted deep links (a real local board probed from the HTTPS page) on all three engines.
      - name: Smoke and hosted checks against the live site
        env:
          PLAYGROUND_URL: ${{ needs.github-pages.outputs.page_url }}
        run: pnpm -F @dnr/playground exec playwright test --grep "@smoke|@polish|@deeplink-hosted"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pages
          path: apps/playground/playwright-report
          if-no-files-found: ignore

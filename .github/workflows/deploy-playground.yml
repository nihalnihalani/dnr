name: deploy-playground

# Production deploys come from main until submission. Phase 14: after tagging
# submission-2026, remove `main` from push.branches so the Playground deploys only from
# that tag until judging ends (plan §10, Phase 14).
on:
  push:
    branches: [main]
    tags: [submission-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-playground-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Require the Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (plan Phase 0, Accounts). Add them with gh secret set."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler is a devDependency of the playground package, so the action uses it
          # instead of trying to `pnpm add` it at the workspace root.
          workingDirectory: apps/playground
          command: >-
            pages deploy dist --project-name=dnr-playground
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - name: Smoke test the deployment
        if: hashFiles('apps/playground/playwright.config.ts') != ''
        env:
          PLAYGROUND_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          pnpm -F @dnr/playground exec playwright install --with-deps chromium
          pnpm -F @dnr/playground exec playwright test --grep @smoke --project=chromium

  github-pages:
    name: GitHub Pages mirror
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The mirror is served under /<repo>/ and ignores _headers (no custom CSP; GitHub's
      # default application/wasm type applies).
      - name: Build for the /<repo>/ base path
        run: |
          pnpm -F @dnr/playground run build --base "/${{ github.event.repository.name }}/" --outDir dist-pages
          cp apps/playground/dist-pages/index.html apps/playground/dist-pages/404.html
          # GitHub Pages has no SPA rewrites: give every known route its own index.html so
          # deep links return HTTP 200 (404.html still catches anything else).
          cd apps/playground/dist-pages
          routes="play graveyard trial replay kiro orders/view"
          for c in $(jq -r '.cases[].id' ../public/cases/index.json); do routes="$routes play/$c"; done
          for o in $(jq -r '.rows[].order.id' ../public/cases/graveyard.json); do routes="$routes orders/$o"; done
          for r in $routes; do mkdir -p "$r" && cp index.html "$r/index.html"; done
          echo "route pages: $routes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist-pages
      - id: pages
        uses: actions/deploy-pages@v4
